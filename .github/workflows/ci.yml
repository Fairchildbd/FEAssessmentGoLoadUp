name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, format check, unit tests and web build
        run: npm run verify

      - name: Install Playwright's headless Chromium
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: E2E tests
        run: npm run test:e2e
